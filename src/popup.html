<!DOCTYPE html>
<html lang="en">

<head>
    <title>Kiosk Exit Button</title>
    <!-- Bootstrap CSS, bundled so the popup makes no network requests and works offline -->
    <link rel="stylesheet" href="lib/bootstrap.min.css" />
    <link rel="stylesheet" href="styles/options.css" />
    <link rel="stylesheet" href="styles/popup.css" />
</head>

<body class="p-3">
    <!-- Title -->
    <div class="d-flex align-items-center mb-3">
        <svg class="icon me-2" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/><circle cx="10" cy="4" r="1.75" fill="currentColor"/><circle cx="5" cy="8" r="1.75" fill="currentColor"/><circle cx="11" cy="12" r="1.75" fill="currentColor"/></svg>
        <h6 class="mb-0 fw-semibold">Kiosk Exit Button</h6>
    </div>

    <hr class="my-2 divider">

    <!-- Status Card -->
    <div class="card shadow-sm mb-3">
        <div class="card-body py-2 px-3">
            <div id="status" class="d-flex align-items-center gap-2">
                <div class="spinner-border spinner-border-sm text-secondary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <span>Checking...</span>
            </div>
        </div>
    </div>

    <hr class="my-2 divider">

    <!-- Action Section -->
    <div class="action-container">
        <button type="button" id="options" class="btn btn-primary w-100" title="Open Settings">
            <svg class="icon me-1" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor"><circle cx="8" cy="8" r="5.5" stroke-width="3" stroke-dasharray="2.16 2.16"/><circle cx="8" cy="8" r="3.5" stroke-width="2.5"/></svg> Open Settings
        </button>
    </div>

    <script src="popup.js"></script>
</body>

</html>
