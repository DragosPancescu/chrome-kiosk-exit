name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    # The tests drive a real, headed Chromium window through fullscreen and kiosk
    # mode. Windows runners have a desktop session, so no virtual display is needed.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run tests
        run: npm test

      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
